services:
  postgres:
    image: postgres:16-alpine
    container_name: bandset-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bandset
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bandset-postgres:/var/lib/postgresql/data
volumes:
  bandset-postgres:
